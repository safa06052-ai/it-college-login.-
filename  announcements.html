<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعلانات والتنبيهات | كلية تقنية المعلومات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Cairo', sans-serif;
  background:
    radial-gradient(circle at top right, #25205a 0, transparent 35%),
    radial-gradient(circle at bottom left, #102d55 0, transparent 35%),
    #080b19;
  color: #f4f5ff;
  min-height: 100vh;
  padding: 25px;
}

.container {
  width: 100%;
  max-width: 1050px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 35px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.brand-icon {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  color: #65eaff;
  background: linear-gradient(135deg, #7654df, #174b91);
  box-shadow: 0 0 22px #5269ff55;
  font-size: 21px;
}

.brand h2 {
  font-size: 17px;
}

.brand p {
  color: #9ca8c8;
  font-size: 12px;
}

.back-btn {
  text-decoration: none;
  color: #dce7ff;
  padding: 10px 17px;
  border: 1px solid #ffffff20;
  border-radius: 12px;
  background: #ffffff0c;
  font-size: 13px;
}

.back-btn:hover {
  background: #7654df55;
}

.hero {
  margin-bottom: 28px;
}

.hero h1 {
  font-size: clamp(25px, 5vw, 35px);
  margin-bottom: 7px;
}

.hero h1 span {
  color: #67eaff;
}

.hero p {
  color: #a5afca;
  font-size: 14px;
}

.glass {
  background: rgba(17, 22, 46, .78);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 20px;
  box-shadow: 0 15px 45px #0003;
  backdrop-filter: blur(18px);
}

.admin-panel {
  padding: 22px;
  margin-bottom: 25px;
  display: none;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  font-size: 17px;
}

.section-title i {
  color: #65eaff;
}

input, textarea, select {
  width: 100%;
  padding: 13px 15px;
  margin-bottom: 13px;
  border: 1px solid #ffffff20;
  border-radius: 12px;
  background: #0c1128;
  color: white;
  font-family: inherit;
  outline: none;
}

input:focus, textarea:focus, select:focus {
  border-color: #7b68ed;
  box-shadow: 0 0 0 3px #7b68ed22;
}

textarea {
  resize: vertical;
  min-height: 115px;
}

select option {
  background: #11162e;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
}

.primary-btn {
  padding: 11px 22px;
  border-radius: 11px;
  color: white;
  background: linear-gradient(120deg, #7654df, #287bd4);
  font-weight: 700;
}

.primary-btn:disabled {
  opacity: .6;
  cursor: wait;
}

.cancel-btn {
  padding: 11px 18px;
  border-radius: 11px;
  color: #dbe5ff;
  background: #ffffff16;
  margin-right: 8px;
}

.status {
  color: #aebbd7;
  font-size: 13px;
  margin-top: 12px;
  min-height: 20px;
}

.announcements {
  display: grid;
  gap: 17px;
}

.announcement {
  padding: 22px;
  position: relative;
  overflow: hidden;
}

.announcement::before {
  content: "";
  position: absolute;
  right: 0;
  top: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(#8e6cff, #55eaff);
}

.announcement-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 13px;
}

.category {
  color: #76eaff;
  background: #52efff14;
  border: 1px solid #52efff30;
  padding: 5px 12px;
  border-radius: 30px;
  font-size: 11px;
}

.date {
  color: #929fbd;
  font-size: 11px;
}

.announcement h3 {
  font-size: 18px;
  margin-bottom: 9px;
}

.announcement-content {
  color: #b9c4df;
  font-size: 14px;
  line-height: 2;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  gap: 9px;
  margin-top: 17px;
}

.edit-btn, .delete-btn {
  padding: 8px 13px;
  border-radius: 9px;
  font-size: 12px;
  color: white;
}

.edit-btn {
  background: #6552c9;
}

.delete-btn {
  background: #a83e58;
}

.empty, .loading {
  padding: 45px 20px;
  text-align: center;
  color: #aab5d0;
}

.empty i {
  font-size: 35px;
  color: #6c7da8;
  margin-bottom: 15px;
}

footer {
  text-align: center;
  color: #697895;
  font-size: 11px;
  margin-top: 40px;
}

@media(max-width: 600px) {
  body { padding: 17px; }
  .admin-panel, .announcement { padding: 17px; }
  .hero { margin-top: 25px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="brand">
    <div class="brand-icon">
      <i class="fa-solid fa-bullhorn"></i>
    </div>
    <div>
      <h2>كلية تقنية المعلومات</h2>
      <p>بوابة الطالب الإلكترونية</p>
    </div>
  </div>

  <a class="back-btn" href="./dashboard.html">
    <i class="fa-solid fa-arrow-right"></i>
    العودة للوحة التحكم
  </a>
</header>

<section class="hero">
  <h1>الإعلانات <span>والتنبيهات</span></h1>
  <p>تابع آخر الأخبار والإعلانات والمستجدات الأكاديمية.</p>
</section>

<section class="glass admin-panel" id="adminPanel">
  <h3 class="section-title">
    <i class="fa-solid fa-pen-to-square"></i>
    <span id="formTitle">إضافة إعلان جديد</span>
  </h3>

  <form id="announcementForm">
    <input
      id="title"
      type="text"
      placeholder="عنوان الإعلان"
      maxlength="150"
      required
    >

    <select id="category">
      <option value="عام">إعلان عام</option>
      <option value="أكاديمي">أكاديمي</option>
      <option value="تنبيه">تنبيه مهم</option>
      <option value="امتحانات">الامتحانات</option>
      <option value="أنشطة">الأنشطة والفعاليات</option>
    </select>

    <textarea
      id="content"
      placeholder="اكتب تفاصيل الإعلان هنا..."
      maxlength="5000"
      required
    ></textarea>

    <label style="display:flex;align-items:center;gap:9px;margin-bottom:15px;font-size:13px;color:#cbd5ee">
      <input id="published" type="checkbox" checked style="width:auto;margin:0">
      نشر الإعلان للطلاب
    </label>

    <button class="primary-btn" id="saveBtn" type="submit">
      <i class="fa-solid fa-plus"></i>
      نشر الإعلان
    </button>

    <button class="cancel-btn" id="cancelBtn" type="button" style="display:none">
      إلغاء التعديل
    </button>

    <p class="status" id="formStatus"></p>
  </form>
</section>

<h3 class="section-title">
  <i class="fa-regular fa-bell"></i>
  أحدث الإعلانات
</h3>

<div class="announcements" id="announcementsList">
  <div class="glass loading">
    <i class="fa-solid fa-spinner fa-spin"></i>
    جارٍ تحميل الإعلانات...
  </div>
</div>

<footer>
  كلية تقنية المعلومات — بوابة الطالب الإلكترونية
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://wteztoggppyksbdhpoxx.supabase.co";

const SUPABASE_KEY = "sb_publishable_O2Crb-WTxmwaOn_uTZtnYQ_NdFz5K_x";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      storage: window.sessionStorage,
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const adminPanel = document.getElementById("adminPanel");
const list = document.getElementById("announcementsList");
const form = document.getElementById("announcementForm");
const formStatus = document.getElementById("formStatus");
const saveBtn = document.getElementById("saveBtn");
const cancelBtn = document.getElementById("cancelBtn");

let currentUser = null;
let isAdmin = false;
let editingId = null;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function formatDate(date) {
  return new Date(date).toLocaleString("ar", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

async function checkUser() {
  const { data, error } = await supabaseClient.auth.getUser();

  if (error || !data.user) {
    window.location.href = "./index.html";
    return false;
  }

  currentUser = data.user;

  const { data: roleData, error: roleError } =
    await supabaseClient
      .from("user_roles")
      .select("role")
      .eq("user_id", currentUser.id)
      .maybeSingle();

  if (roleError) {
    console.error(roleError);
    alert("تعذر التحقق من صلاحيات الحساب.");
    return false;
  }

  isAdmin = roleData?.role === "admin";

  if (isAdmin) {
    adminPanel.style.display = "block";
  }

  return true;
}

async function loadAnnouncements() {
  list.innerHTML = `
    <div class="glass loading">
      <i class="fa-solid fa-spinner fa-spin"></i>
      جارٍ تحميل الإعلانات...
    </div>
  `;

  const { data, error } = await supabaseClient
    .from("announcements")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    list.innerHTML = `
      <div class="glass empty">
        تعذر تحميل الإعلانات. تأكدي من اتصال قاعدة البيانات.
      </div>
    `;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = `
      <div class="glass empty">
        <i class="fa-regular fa-bell-slash"></i>
        <h3>لا توجد إعلانات حاليًا</h3>
        <p>ستظهر الإعلانات الجديدة هنا عند نشرها.</p>
      </div>
    `;
    return;
  }

  list.innerHTML = data.map(item => `
    <article class="glass announcement">
      <div class="announcement-top">
        <span class="category">${escapeHTML(item.category)}</span>
        <span class="date">
          <i class="fa-regular fa-clock"></i>
          ${escapeHTML(formatDate(item.created_at))}
        </span>
      </div>

      <h3>${escapeHTML(item.title)}</h3>
      <p class="announcement-content">${escapeHTML(item.content)}</p>

      ${isAdmin ? `
        <div class="actions">
          <button class="edit-btn" onclick="editAnnouncement(${Number(item.id)})">
            <i class="fa-solid fa-pen"></i> تعديل
          </button>
          <button class="delete-btn" onclick="deleteAnnouncement(${Number(item.id)})">
            <i class="fa-solid fa-trash"></i> حذف
          </button>
          ${item.is_published ? "" : '<span class="category">غير منشور</span>'}
        </div>
      ` : ""}
    </article>
  `).join("");
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!isAdmin) return;

  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  const category = document.getElementById("category").value;
  const is_published = document.getElementById("published").checked;

  if (!title || !content) {
    formStatus.textContent = "يرجى تعبئة العنوان ومحتوى الإعلان.";
    return;
  }

  saveBtn.disabled = true;
  formStatus.textContent = "جارٍ حفظ الإعلان...";

  const announcement = {
    title,
    content,
    category,
    is_published
  };

  let result;

  if (editingId !== null) {
    result = await supabaseClient
      .from("announcements")
      .update(announcement)
      .eq("id", editingId);
  } else {
    result = await supabaseClient
      .from("announcements")
      .insert(announcement);
  }

  saveBtn.disabled = false;

  if (result.error) {
    console.error(result.error);
    formStatus.textContent = "حدث خطأ أثناء الحفظ: " + result.error.message;
    return;
  }

  form.reset();
  document.getElementById("published").checked = true;
  resetEditMode();

  formStatus.textContent = "تم حفظ الإعلان بنجاح.";
  await loadAnnouncements();
});

window.editAnnouncement = async function(id) {
  if (!isAdmin) return;

  const { data, error } = await supabaseClient
    .from("announcements")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !data) {
    alert("تعذر تحميل الإعلان للتعديل.");
    return;
  }

  editingId = id;

  document.getElementById("title").value = data.title;
  document.getElementById("content").value = data.content;
  document.getElementById("category").value = data.category;
  document.getElementById("published").checked = data.is_published;

  document.getElementById("formTitle").textContent = "تعديل الإعلان";
  saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> حفظ التعديلات';
  cancelBtn.style.display = "inline-block";

  adminPanel.scrollIntoView({ behavior: "smooth" });
};

window.deleteAnnouncement = async function(id) {
  if (!isAdmin) return;

  const confirmed = confirm("هل أنت متأكد من حذف هذا الإعلان؟");

  if (!confirmed) return;

  const { error } = await supabaseClient
    .from("announcements")
    .delete()
    .eq("id", id);

  if (error) {
    alert("تعذر حذف الإعلان: " + error.message);
    return;
  }

  await loadAnnouncements();
};

function resetEditMode() {
  editingId = null;
  document.getElementById("formTitle").textContent = "إضافة إعلان جديد";
  saveBtn.innerHTML = '<i class="fa-solid fa-plus"></i> نشر الإعلان';
  cancelBtn.style.display = "none";
}

cancelBtn.addEventListener("click", function() {
  form.reset();
  document.getElementById("published").checked = true;
  resetEditMode();
  formStatus.textContent = "";
});

async function startPage() {
  const authenticated = await checkUser();

  if (!authenticated) return;

  await loadAnnouncements();
}

startPage();
</script>

</body>
</html>
