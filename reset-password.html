<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تغيير كلمة المرور | كلية تقنية المعلومات</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Cairo', sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 15%, #30205c 0, transparent 35%),
        radial-gradient(circle at 85% 85%, #073a53 0, transparent 35%),
        #080b19;
    }

    .card {
      width: 100%;
      max-width: 410px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid rgba(146, 103, 255, .45);
      border-radius: 24px;
      background: rgba(17, 22, 46, .82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 0 35px rgba(100, 70, 255, .18);
    }

    .logo {
      font-size: 36px;
      margin-bottom: 8px;
      color: #52efff;
      text-shadow: 0 0 20px rgba(82, 239, 255, .55);
    }

    h1 {
      font-size: 23px;
      margin: 8px 0;
    }

    p {
      color: #b9c4df;
      font-size: 13px;
      line-height: 1.9;
    }

    input {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid rgba(147, 103, 255, .45);
      border-radius: 12px;
      outline: none;
      background: rgba(8, 11, 25, .8);
      color: white;
      font-family: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: #52efff;
      box-shadow: 0 0 12px rgba(82, 239, 255, .15);
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      color: #080b19;
      background: linear-gradient(100deg, #9367ff, #52efff);
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    #message {
      overflow-wrap: anywhere;
      margin-top: 14px;
    }

    a {
      color: #52efff;
      text-decoration: none;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">✧</div>

    <h1>كلمة مرور جديدة</h1>

    <p>
      اختاري كلمة مرور جديدة لحسابك،
      واحرصي على إدخالها بشكل صحيح.
    </p>

    <form id="passwordForm">
      <input
        id="password"
        type="password"
        placeholder="كلمة المرور الجديدة"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <input
        id="confirmPassword"
        type="password"
        placeholder="تأكيد كلمة المرور"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button id="saveButton" type="submit">
        حفظ كلمة المرور
      </button>
    </form>

    <p id="message" role="status">
      افتحي هذه الصفحة من رابط الاسترجاع الذي وصلك بالإيميل.
    </p>

    <a class="back" href="./index.html">
      العودة إلى تسجيل الدخول
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://wteztoggppyksbdhpoxx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_O2Crb-WTxmwaOn_uTZtnYQ_NdFz5K_x";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");

    let recoveryReady = false;

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryReady = true;
        message.textContent =
          "تم التحقق من رابط الاسترجاع. يمكنك تعيين كلمة مرور جديدة.";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (passwordInput.value !== confirmInput.value) {
        message.textContent = "كلمتا المرور غير متطابقتين.";
        return;
      }

      if (passwordInput.value.length < 8) {
        message.textContent =
          "يجب أن تتكون كلمة المرور من 8 أحرف على الأقل.";
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "جارٍ الحفظ...";
      message.textContent = "";

      try {
        const { data: sessionData } =
          await supabase.auth.getSession();

        if (!recoveryReady && !sessionData.session) {
          message.textContent =
            "رابط الاسترجاع غير صالح أو انتهت صلاحيته. اطلبي رابطًا جديدًا من صفحة تسجيل الدخول.";
          return;
        }

        const { error } = await supabase.auth.updateUser({
          password: passwordInput.value
        });

        if (error) throw error;

        message.textContent =
          "تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.";

        form.reset();
      } catch (error) {
        message.textContent =
          error.message || "تعذر تغيير كلمة المرور. حاولي مرة أخرى.";
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "حفظ كلمة المرور";
      }
    });
  </script>
</body>
</html>
