
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b19">
<title>الملف الشخصي | كلية تقنية المعلومات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --bg:#080b19;
  --purple:#9367ff;
  --cyan:#52efff;
  --pink:#e879f9;
  --text:#f1f0ff;
  --muted:#b7b9df;
  --border:rgba(147,103,255,.35);
  --panel:rgba(17,22,46,.82);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Cairo',sans-serif;
  color:var(--text);
  min-height:100vh;
  background:
    radial-gradient(ellipse at 85% 10%,#49258a66,transparent 40%),
    radial-gradient(ellipse at 10% 85%,#153b8066,transparent 38%),
    var(--bg);
}

button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.app{display:flex;min-height:100vh}

.sidebar{
  width:235px;flex-shrink:0;padding:24px 16px;
  border-left:1px solid var(--border);
  background:rgba(7,13,39,.88);
  display:flex;flex-direction:column;
}

.brand{
  display:flex;align-items:center;gap:12px;
  padding:0 12px 28px;color:#a8baff;
  font-size:15px;font-weight:800;
}

.brand i{color:var(--cyan);font-size:25px}

.nav{display:grid;gap:9px}

.nav a{
  display:flex;align-items:center;gap:15px;
  padding:13px 15px;border:1px solid transparent;
  border-radius:12px;color:#b8caff;transition:.2s;
}

.nav a i{width:23px;text-align:center;font-size:19px}

.nav a:hover,.nav a.active{
  color:white;
  background:linear-gradient(110deg,#25228b,#5426bd);
  border-color:#775aff;
  box-shadow:0 0 18px #3e32b633;
}

.sidebar-bottom{
  margin-top:auto;padding-top:25px;
  border-top:1px solid var(--border);
}

.logout{
  width:100%;display:flex;align-items:center;gap:12px;
  background:transparent;border:0;color:#ef75ff;
  padding:12px;text-align:right;
}

.main{flex:1;min-width:0}

.topbar{
  min-height:74px;padding:0 30px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:rgba(8,14,42,.72);
}

.topbar-title{font-weight:800;color:#bdcaff}

.topbar-actions{display:flex;align-items:center;gap:18px;color:#a9baff}

.topbar-actions button{
  color:inherit;background:none;border:0;font-size:19px;
}

.content{max-width:1250px;margin:auto;padding:28px}

.hero{
  min-height:170px;padding:30px;
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;position:relative;overflow:hidden;
  border:1px solid var(--cyan);border-radius:20px;
  background:
    radial-gradient(circle at 5% 100%,#5425b9,transparent 32%),
    linear-gradient(110deg,#10144b,#102d77,#075b9a);
  box-shadow:inset 0 0 35px #243fff30,0 0 25px #263bff20;
}

.hero h1{font-size:clamp(27px,4vw,38px);margin-bottom:8px}
.hero p{color:#c7dfff;font-size:14px;line-height:2}

.hero-icon{
  width:90px;height:90px;flex-shrink:0;
  display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--cyan);
  background:#52efff18;color:var(--cyan);
  font-size:40px;
  box-shadow:0 0 25px #52efff33;
}

.glass-panel{
  margin-top:24px;padding:24px;
  border:1px solid var(--border);
  border-radius:19px;
  background:var(--panel);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 0 30px #9367ff0d,0 10px 35px #0003;
}

.panel-title{
  display:flex;align-items:center;gap:12px;
  color:#d6ccff;font-size:19px;
  padding-bottom:17px;margin-bottom:20px;
  border-bottom:1px solid #9367ff30;
}

.panel-title i{color:var(--cyan)}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}

.field{min-width:0}

.field label{
  display:block;color:#83caff;
  font-size:13px;margin-bottom:9px;
}

.field input,.field select{
  width:100%;height:49px;padding:0 14px;
  color:#f1f0ff;
  background:linear-gradient(110deg,#101b42,#101735);
  border:1px solid #5361bd;
  border-radius:12px;outline:none;
  transition:.2s;
}

.field input:focus,.field select:focus{
  border-color:var(--cyan);
  box-shadow:0 0 13px #52efff22;
}

.field input::placeholder{color:#7784b0}

.field select option{
  background:#101735;color:white;
}

.field.full{grid-column:1/-1}

.actions{
  display:flex;flex-wrap:wrap;gap:12px;
  margin-top:25px;
}

.save-btn,.cancel-btn{
  min-width:150px;padding:12px 20px;
  border-radius:12px;font-weight:700;
  transition:.2s;
}

.save-btn{
  border:1px solid var(--cyan);
  color:white;
  background:linear-gradient(110deg,#7436ed,#245bdc);
  box-shadow:0 0 18px #593aff30;
}

.save-btn:hover{filter:brightness(1.15)}

.save-btn:disabled{
  opacity:.65;
  cursor:wait;
}

.cancel-btn{
  border:1px solid var(--purple);
  color:#d2c5ff;background:transparent;
}

.status{
  display:none;margin-top:18px;padding:12px 15px;
  border-radius:11px;font-size:13px;line-height:1.8;
}

.status.success{
  display:block;color:#9bffd5;
  background:#1caa7220;border:1px solid #37d99a55;
}

.status.error{
  display:block;color:#ffb3c1;
  background:#e94b7020;border:1px solid #ff668055;
}

.status.info{
  display:block;color:#b9dcff;
  background:#327ad020;border:1px solid #52aaff55;
}

.footer{
  text-align:center;color:#657fca;
  font-size:12px;letter-spacing:2px;
  padding:35px 10px 12px;
}

.footer span{color:#9d78ff}

@media(max-width:700px){
  .app{display:block}
  .sidebar{
    width:100%;min-height:auto;padding:12px;
    border-left:0;border-bottom:1px solid var(--border);
  }
  .brand{padding:3px 8px 12px}
  .nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .nav a{flex:0 0 auto;gap:7px;padding:9px 11px;font-size:12px}
  .nav a i{font-size:15px;width:auto}
  .sidebar-bottom{display:none}
  .topbar{min-height:55px;padding:0 16px}
  .topbar-title{font-size:12px}
  .content{padding:16px 12px}
  .hero{min-height:145px;padding:22px 18px}
  .hero-icon{width:65px;height:65px;font-size:29px}
  .hero h1{font-size:26px}
  .hero p{font-size:12px}
  .glass-panel{padding:17px}
  .profile-grid{grid-template-columns:1fr;gap:16px}
  .field.full{grid-column:auto}
  .actions button{flex:1}
  .footer{letter-spacing:1px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
  <div class="brand">
    <i class="fa-solid fa-graduation-cap"></i>
    <span>كلية تقنية المعلومات</span>
  </div>

  <nav class="nav">
    <a href="./dashboard.html">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>

    <a href="./dashboard.html#departments">
      <i class="fa-solid fa-grip"></i>
      <span>الأقسام</span>
    </a>

    <a href="./profile.html" class="active">
      <i class="fa-solid fa-user"></i>
      <span>الملف الشخصي</span>
    </a>
  </nav>

  <div class="sidebar-bottom">
    <button class="logout" id="logoutBtn">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>تسجيل الخروج</span>
    </button>
  </div>
</aside>

<main class="main">

<header class="topbar">
  <div class="topbar-title">بوابة كلية تقنية المعلومات</div>

  <div class="topbar-actions">
    <span id="welcomeEmail">الملف الشخصي</span>
    <button type="button" id="topLogoutBtn" aria-label="تسجيل الخروج">
      <i class="fa-solid fa-right-from-bracket"></i>
    </button>
  </div>
</header>

<div class="content">

<section class="hero">
  <div>
    <h1>الملف الشخصي</h1>
    <p>يمكن عرض البيانات الشخصية وتعديلها في أي وقت.</p>
  </div>

  <div class="hero-icon">
    <i class="fa-solid fa-user"></i>
  </div>
</section>

<section class="glass-panel">

  <h2 class="panel-title">
    <i class="fa-solid fa-id-card"></i>
    المعلومات الأساسية
  </h2>

  <form id="profileForm">

    <div class="profile-grid">

      <div class="field">
        <label for="fullName">الاسم الكامل</label>
        <input
          id="fullName"
          type="text"
          placeholder="أدخل الاسم الكامل"
          maxlength="100"
          required
        >
      </div>

      <div class="field">
        <label for="studentNumber">الرقم الجامعي</label>
        <input
          id="studentNumber"
          type="text"
          placeholder="أدخل الرقم الجامعي"
          maxlength="30"
          required
        >
      </div>

      <div class="field">
        <label for="department">القسم</label>
        <select id="department" required>
          <option value="">اختر القسم</option>
          <option value="القسم العام">القسم العام</option>
          <option value="هندسة البرمجيات">هندسة البرمجيات</option>
          <option value="الشبكات والاتصالات">الشبكات والاتصالات</option>
          <option value="علوم الحاسوب">علوم الحاسوب</option>
        </select>
      </div>

      <div class="field">
        <label for="specialization">التخصص</label>
        <select id="specialization" required>
          <option value="">اختر التخصص</option>
          <option value="عام">عام</option>
          <option value="هندسة البرمجيات">هندسة البرمجيات</option>
          <option value="الشبكات والاتصالات">الشبكات والاتصالات</option>
          <option value="الأمن السيبراني">الأمن السيبراني</option>
          <option value="الذكاء الاصطناعي">الذكاء الاصطناعي</option>
          <option value="علوم الحاسوب">علوم الحاسوب</option>
        </select>
      </div>

      <div class="field full">
        <label for="academicLevel">المستوى الدراسي</label>
        <select id="academicLevel" required>
          <option value="">اختر المستوى الدراسي</option>
          <option value="السنة الأولى">السنة الأولى</option>
          <option value="السنة الثانية">السنة الثانية</option>
          <option value="السنة الثالثة">السنة الثالثة</option>
          <option value="السنة الرابعة">السنة الرابعة</option>
          <option value="السنة الخامسة">السنة الخامسة</option>
        </select>
      </div>

    </div>

    <div class="actions">
      <button type="submit" class="save-btn" id="saveBtn">
        <i class="fa-solid fa-floppy-disk"></i>
        حفظ التغييرات
      </button>

      <button type="reset" class="cancel-btn">
        <i class="fa-solid fa-rotate-left"></i>
        إلغاء
      </button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

  </form>
</section>

<footer class="footer">
  <span>✦</span>
  Information Technology College
  <span>✦</span>
</footer>

</div>
</main>
</div>

<script>
const SUPABASE_URL = "https://wteztoggppyksbdhpoxx.supabase.co";
const SUPABASE_KEY = "sb_publishable_O2Crb-WTxmwaOn_uTZtnYQ_NdFz5K_x";

const form = document.getElementById("profileForm");
const statusBox = document.getElementById("status");
const saveBtn = document.getElementById("saveBtn");

let client;
let currentUser;

function showStatus(message,type){
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

function clearStatus(){
  statusBox.textContent = "";
  statusBox.className = "status";
}

const script = document.createElement("script");
script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

script.onload = initializeProfile;

script.onerror = () => {
  showStatus("تعذر تحميل النظام. تحقق من اتصال الإنترنت.","error");
};

document.head.appendChild(script);

async function initializeProfile(){

  client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        storage:window.sessionStorage,
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );

  const {data,error} = await client.auth.getSession();

  if(error || !data.session){
    window.location.replace("./index.html");
    return;
  }

  currentUser = data.session.user;

  document.getElementById("welcomeEmail").textContent =
    currentUser.email || "الملف الشخصي";

  await loadProfile();

  document.getElementById("logoutBtn").addEventListener("click",logout);
  document.getElementById("topLogoutBtn").addEventListener("click",logout);
}

async function loadProfile(){

  showStatus("جاري تحميل البيانات...","info");

  const {data,error} = await client
    .from("student_profiles")
    .select("full_name,student_number,department,specialization,academic_level")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(error){
    showStatus("تعذر تحميل البيانات: " + error.message,"error");
    return;
  }

  if(data){
    document.getElementById("fullName").value = data.full_name || "";
    document.getElementById("studentNumber").value = data.student_number || "";
    document.getElementById("department").value = data.department || "";
    document.getElementById("specialization").value = data.specialization || "";
    document.getElementById("academicLevel").value = data.academic_level || "";

    showStatus("تم تحميل بيانات الملف الشخصي.","success");
  }else{
    showStatus("أهلًا بك! أدخل البيانات ثم اضغط على حفظ التغييرات.","info");
  }
}

form.addEventListener("submit",async function(event){

  event.preventDefault();
  clearStatus();

  if(!currentUser){
    showStatus("يرجى تسجيل الدخول أولًا.","error");
    return;
  }

  const profile = {
    user_id:currentUser.id,
    full_name:document.getElementById("fullName").value.trim(),
    student_number:document.getElementById("studentNumber").value.trim(),
    department:document.getElementById("department").value,
    specialization:document.getElementById("specialization").value,
    academic_level:document.getElementById("academicLevel").value,
    updated_at:new Date().toISOString()
  };

  if(!profile.full_name || !profile.student_number ||
     !profile.department || !profile.specialization ||
     !profile.academic_level){
    showStatus("يرجى تعبئة جميع البيانات.","error");
    return;
  }

  saveBtn.disabled = true;
  saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

  try{
    const {error} = await client
      .from("student_profiles")
      .upsert(profile,{onConflict:"user_id"});

    if(error){
      showStatus("تعذر حفظ البيانات: " + error.message,"error");
      return;
    }

    showStatus("تم حفظ بيانات الملف الشخصي بنجاح.","success");

  }catch(error){
    showStatus("حدث خطأ أثناء حفظ البيانات. حاول مرة أخرى.","error");

  }finally{
    saveBtn.disabled = false;
    saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> حفظ التغييرات';
  }
});

form.addEventListener("reset",function(){
  setTimeout(clearStatus,0);
});

async function logout(){

  const {error} = await client.auth.signOut();

  if(error){
    showStatus("تعذر تسجيل الخروج. حاول مرة أخرى.","error");
    return;
  }

  window.location.replace("./index.html");
}
</script>

</body>
</html>
